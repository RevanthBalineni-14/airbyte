        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          response_filters:
            - type: HttpResponseFilter
              action: IGNORE
              http_codes:
                - 403
              error_message: >-
                Skipping spend_limit_windows: the API answered 403 ({{
                (response.error.message or "no error message") if response is
                mapping and response.error is mapping else (response.error if
                response is mapping and response.error is string and
                response.error else "no error message") }}). OpenAI documents
                this endpoint only for ad accounts on postpaid invoice billing
                and for API keys with permission to manage billing.
          backoff_strategies:
            - type: WaitTimeFromHeader
              header: Retry-After
            - type: ExponentialBackoffStrategy
              factor: 5
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        url: https://api.ads.openai.com/v1/ad_account/spend_limit_windows
