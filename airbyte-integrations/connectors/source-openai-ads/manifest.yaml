version: 7.0.4

type: DeclarativeSource

description: >-
  Syncs campaigns, ad groups, ads, insights and conversion data from the OpenAI
  Ads API.

check:
  type: CheckStream
  stream_names:
    - ad_account

definitions:
  linked:
    HttpRequester:
      request_headers:
        Accept: application/json
      authenticator:
        type: BearerAuthenticator
        api_token: "{{ config[\"api_key\"] }}"
      error_handler:
        type: DefaultErrorHandler
        max_retries: 5
        backoff_strategies:
          - type: WaitTimeFromHeader
            header: Retry-After
          - type: ExponentialBackoffStrategy
            factor: 5
      request_parameters:
        fields[]: "{{ parameters[\"fields\"] }}"
        segments[]: "{{ parameters.get(\"segments\", []) }}"
        time_ranges[]: >-
          {{ [ '{"type":"date_range","since":"' ~ stream_slice["start_time"] ~
          '","until":"' ~ stream_slice["end_time"] ~ '"}' ] }}
        time_granularity: daily
        aggregation_level: "{{ parameters[\"aggregation_level\"] }}"
      request_body:
        type: RequestBodyJsonObject
        value:
          entity_ids: "{{ [ stream_slice[\"entity_id\"] ] }}"
          time_ranges: >-
            {{ [ '{"type":"date_range","since":"' ~ stream_slice["start_time"] ~
            '","until":"' ~ stream_slice["end_time"] ~ '"}' ] }}
          time_granularity: daily
          aggregation_level: "{{ parameters[\"aggregation_level\"] }}"
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: after
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          page_size: 500
          cursor_value: "{{ response.get(\"last_id\") }}"
          stop_condition: "{{ not response.get(\"has_more\") }}"

streams:
  - type: DeclarativeStream
    name: ad_account
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        url: https://api.ads.openai.com/v1/ad_account
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        required:
          - id
        properties:
          id:
            type: string
          url:
            type:
              - string
              - "null"
          name:
            type:
              - string
              - "null"
          review:
            type:
              - object
              - "null"
            properties:
              status:
                type:
                  - string
                  - "null"
            additionalProperties: true
          status:
            type:
              - string
              - "null"
          timezone:
            type:
              - string
              - "null"
          brand_name:
            type:
              - string
              - "null"
          legal_name:
            type:
              - string
              - "null"
          preview_url:
            type:
              - string
              - "null"
          account_name:
            type:
              - string
              - "null"
          currency_code:
            type:
              - string
              - "null"
          account_integrity_review:
            type:
              - object
              - "null"
            properties:
              review:
                type:
                  - object
                  - "null"
                properties:
                  status:
                    type:
                      - string
                      - "null"
                additionalProperties: true
              details:
                type:
                  - object
                  - "null"
                properties:
                  decision:
                    type:
                      - string
