          order_created_attributed_sales:
            type:
              - string
              - "null"
          order_created_attributed_sales_currency:
            type:
              - string
              - "null"
        additionalProperties: true
      aggregation_level: ad
      $parameters:
        aggregation_level: ad
    incremental_sync:
      type: DatetimeBasedCursor
      step: P14D
      cursor_field: date
      end_datetime:
        type: MinMaxDatetime
        datetime: >-
          {{ config.get("end_date") or (now_utc() -
          duration("PT12H")).strftime("%Y-%m-%d") }}
        max_datetime: "{{ (now_utc() - duration(\"PT12H\")).strftime(\"%Y-%m-%d\") }}"
        datetime_format: "%Y-%m-%d"
        aggregation_level: ad
        $parameters:
          aggregation_level: ad
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config.get(\"start_date\") or \"2026-02-01\" }}"
        datetime_format: "%Y-%m-%d"
        aggregation_level: ad
        $parameters:
          aggregation_level: ad
      datetime_format: "%Y-%m-%d"
      lookback_window: P{{ config.get("lookback_window", 32) }}D
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"
      aggregation_level: ad
      $parameters:
        aggregation_level: ad
    aggregation_level: ad
    $parameters:
      aggregation_level: ad

spec:
  type: Spec
  documentation_url: https://docs.airbyte.com/integrations/sources/openai-ads
  connection_specification:
    type: object
    title: OpenAI Ads Spec
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
    properties:
      api_key:
        type: string
        description: >-
          The API key issued in the Settings page of OpenAI Ads Manager. Each
          key is scoped to one ad account. For more information, see <a
          href="https://developers.openai.com/ads/api-quickstart">OpenAI's
          documentation</a>.
        order: 0
        title: API Key
        airbyte_secret: true
      end_date:
        type: string
        description: >-
          Date in the ad account's time zone, in the format YYYY-MM-DD. Any data
          after this date will not be replicated. If empty or later than the
          current date in UTC-12 (the latest date that has started in every time
          zone), data is synced through that date.
        order: 2
        title: End Date
        format: date
        pattern: ^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2026-12-31"
        pattern_descriptor: YYYY-MM-DD
      start_date:
        type: string
        description: >-
          Date in the ad account's time zone, in the format YYYY-MM-DD. Any data
          before this date will not be replicated. Defaults to 2026-02-01, when
          ads in ChatGPT launched; there is no data before that. OpenAI keeps
          daily insights for the most recent 365 days and product insights for
          about 30 days, so older days are no longer available for those
          streams.
        order: 1
        title: Start Date
        format: date
        default: "2026-02-01"
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2026-02-01"
        pattern_descriptor: YYYY-MM-DD
      num_workers:
        type: integer
        description: >-
          The number of worker threads to use for the sync. Increase this to
          speed up syncs for accounts with many campaigns. The default should
          work for most use cases.
        order: 4
        title: Number of concurrent workers
        default: 3
        maximum: 20
        minimum: 1
      lookback_window:
        type: integer
        description: >-
          How far into the past to look for records (in days) on every sync, so
          conversions attributed after the click are picked up. Use the click
          attribution window of the reports (30 days, the API default) plus 2
          days, because OpenAI needs at least one day to process conversions.
          Used only for insights streams in incremental sync mode.
        order: 3
        title: Lookback Window
        default: 32
        maximum: 90
        minimum: 0
    additionalProperties: true

